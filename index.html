<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Flappy Arcade - A polished HTML5 canvas game demo">
  <title>Flappy Arcade — Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrapper" role="application" aria-label="Flappy Arcade game">
    <!-- Canvas Container -->
    <div id="canvas-container">
      <canvas id="game-canvas" role="button" aria-label="Game canvas. Tap, click, or press Space to flap."></canvas>

      <!-- HUD / Score -->
      <div id="hud" class="overlay" aria-live="polite" aria-atomic="true">
        <div id="score-display">0</div>
        <div id="high-score-display">Best: <span id="high-score-value">0</span></div>
      </div>

      <!-- Wind Indicator -->
      <div id="wind-indicator" class="overlay" aria-hidden="true">
        <span id="wind-text">WIND</span>
        <div id="wind-arrow"></div>
      </div>

      <!-- Mute Button -->
      <button id="mute-btn" class="ui-btn" aria-label="Toggle sound" title="Toggle sound">
        <svg id="icon-sound-on" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="icon-sound-off" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="display:none">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>

      <!-- Start Screen -->
      <div id="start-screen" class="screen-overlay">
        <div class="screen-content">
          <h1>Flappy Arcade</h1>
          <p class="tagline">Tap, click, or press <kbd>Space</kbd> to fly</p>
          <div class="instructions">
            <span class="key-badge">Space</span>
            <span class="key-badge">↑</span>
            <span class="key-badge">Click</span>
            <span class="key-badge">Tap</span>
          </div>
          <button id="start-btn" class="primary-btn">Play</button>
        </div>
      </div>

      <!-- Game Over Screen -->
      <div id="gameover-screen" class="screen-overlay" style="display:none">
        <div class="screen-content">
          <h2>Game Over</h2>
          <div class="final-stats">
            <div class="stat">
              <span class="stat-label">Score</span>
              <span id="final-score" class="stat-value">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Best</span>
              <span id="final-high-score" class="stat-value">0</span>
            </div>
          </div>
          <button id="restart-btn" class="primary-btn">Play Again</button>
        </div>
      </div>

      <!-- Milestone Toast -->
      <div id="milestone-toast" class="overlay" aria-live="polite" style="display:none">
        <span id="milestone-text">10!</span>
      </div>

      <!-- Speed Up Toast -->
      <div id="speedup-toast" class="overlay" aria-live="polite">
        <span id="speedup-text">SPEED UP!</span>
      </div>

      <!-- Landscape Warning -->
      <div id="landscape-warning" style="display:none">
        <p>Please rotate your device to portrait mode for the best experience.</p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
